[package]
name = "git-curriculo-desktop"
version = "0.2.0"
description = "Git Curriculo Desktop"
authors = ["Git Curriculo"]
edition = "2021"

[lib]
name = "git_curriculo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
